[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trending-to-tweet"
version = "0.4.0"
description = "TUI local para convertir tendencias técnicas en borradores para X"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Matias Blanc" }]
keywords = ["x", "twitter", "github", "content", "obsidian", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "textual>=1.0.0",
    "tweepy>=4.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
release = ["build>=1.2", "twine>=6.0"]

[project.urls]
Homepage = "https://github.com/MatiasBlanc/Trending2Tweet"
Repository = "https://github.com/MatiasBlanc/Trending2Tweet"
Issues = "https://github.com/MatiasBlanc/Trending2Tweet/issues"

[project.scripts]
trending-to-tweet = "main:main"
t2t = "main:main"

[tool.setuptools]
py-modules = ["main", "twitter_client"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bots*", "db*", "prompts*", "sources*", "src*"]

[tool.setuptools.package-data]
prompts = ["*.txt", "*.json"]
"src.tui" = ["styles/*.tcss"]
