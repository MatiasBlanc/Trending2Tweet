name: Publicar en PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Construir distribución
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Construir wheel y sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Guardar distribución
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    name: Publicar distribución
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trending-to-tweet
    permissions:
      id-token: write
    steps:
      - name: Descargar distribución
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publicar con Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
